[project]
name = "yeastar-mcp"
version = "0.1.0"
description = "MCP server for Yeastar P-Series Appliance-Edition PBX (MSPbots Agent platform connector)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp[cli]>=1.9.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "starlette>=0.38.0,<1.0.0",
]

[project.scripts]
yeastar-mcp = "yeastar_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yeastar_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "mypy>=1.11.0,<2.0.0",
    "respx>=0.21.0,<1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
