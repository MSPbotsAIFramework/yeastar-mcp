# Local debug only. Credentials are supplied per-request via headers (see README),
# never via environment variables — this file sets no credential values.
services:
  yeastar-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      MCP_HTTP_PORT: "8080"
      MCP_HTTP_HOST: "0.0.0.0"
